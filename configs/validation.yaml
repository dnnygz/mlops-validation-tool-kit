# Umbrales didacticos
data:
  required_columns:
    - transaction_id
    - amount
    - hour
    - customer_age
    - account_age_days
    - is_international
    - channel
    - label
  max_null_fraction: 0.0
  min_rows: 500
model:
  min_precision: 0.30
  min_recall: 0.55
  min_f1: 0.40
  min_average_precision: 0.45
  require_better_than_baseline: true

